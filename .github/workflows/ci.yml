name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- unit tests + static analysis ----
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests (with race detector)
        run: go test -race ./...

  # ---- end-to-end integration against a real tmux backend ----
  integration:
    name: integration (tmux)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build
        run: go build -o bin/panopticon ./cmd/panopticon

      # tmux wants a working TERM and a clean home for an isolated server.
      - name: Run integration suite
        env:
          TERM: xterm-256color
        run: |
          # Leave the process tree clean so the test's trap can manage it.
          ./integration.sh

  # ---- release artifacts (build binaries, no upload) ----
  build-release:
    name: build release binaries
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build linux binaries
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/panopticon-linux-amd64 ./cmd/panopticon
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/panopticon-linux-arm64 ./cmd/panopticon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panopticon-linux-binaries
          path: dist/*

      - name: Print checksums
        run: shasum -a 256 dist/*
